<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hangul Ascend</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">

<style>
body{
    margin:0;
    background:#111827;
    font-family:Arial, sans-serif;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.container{
    width:95%;
    max-width:520px;
    background:#1f2937;
    padding:25px;
    border-radius:20px;
    text-align:center;
}
.char{
    font-size:85px;
    margin:20px 0;
}
button{
    margin-top:10px;
    padding:10px 20px;
    border:none;
    border-radius:10px;
    font-size:16px;
    background:#10b981;
    color:white;
}
.secondary{
    background:#374151;
}
input{
    width:90%;
    padding:14px;
    font-size:18px;
    border-radius:10px;
    border:none;
    text-align:center;
    margin-top:10px;
}
.stats{
    margin-top:12px;
    font-size:14px;
}
.timer{
    margin-top:12px;
}
.bar{
    height:6px;
    background:#374151;
    border-radius:4px;
    overflow:hidden;
}
.fill{
    height:100%;
    width:100%;
    background:#10b981;
    transition:width 1s linear;
}
.feedback{
    margin-top:10px;
    min-height:22px;
}
.stage{
    font-size:13px;
    opacity:.7;
}
</style>
</head>
<body>

<div class="container">
    <div class="stage" id="stage"></div>
    <div>Poziom: <span id="level">1</span></div>

    <div class="char" id="char"></div>
    <button class="secondary" onclick="replay()">🔊 Odsłuchaj</button>

    <input id="answer" placeholder="Wpisz polską fonetykę..." autofocus>

    <div class="feedback" id="feedback"></div>

    <div class="stats">
        Punkty: <span id="points">0</span> |
        Streak: <span id="streak">0</span>
    </div>

    <div class="timer">
        <div class="bar"><div class="fill" id="bar"></div></div>
        <div>Czas: <span id="time"></span>s</div>
    </div>
</div>

<script>

// ===== DATA =====

const stages = [
{
name:"Spółgłoski",
pool:[
{c:"ㄱ",a:["g","k"]},{c:"ㄴ",a:["n"]},{c:"ㄷ",a:["d","t"]},
{c:"ㄹ",a:["r","l"]},{c:"ㅁ",a:["m"]},{c:"ㅂ",a:["b","p"]},
{c:"ㅅ",a:["s"]},{c:"ㅇ",a:["ng",""]},{c:"ㅈ",a:["dz","j"]},
{c:"ㅎ",a:["h"]}
]},
{
name:"Samogłoski",
pool:[
{c:"ㅏ",a:["a"]},{c:"ㅓ",a:["o"]},{c:"ㅗ",a:["o"]},
{c:"ㅜ",a:["u"]},{c:"ㅡ",a:["y"]},{c:"ㅣ",a:["i"]},
{c:"ㅐ",a:["e"]},{c:"ㅔ",a:["e"]}
]},
{
name:"Sylaby",
pool:[
{c:"가",a:["ga"]},{c:"나",a:["na"]},{c:"다",a:["da","ta"]},
{c:"라",a:["ra","la"]},{c:"마",a:["ma"]},{c:"바",a:["ba","pa"]},
{c:"사",a:["sa"]},{c:"자",a:["dza","ja"]}
]},
{
name:"Słowa",
pool:[
{c:"감사합니다",a:["gamsahamnida"]},
{c:"안녕하세요",a:["annjonghasejo","annyeonghasejo"]}
]}
];

// ===== GAME STATE =====

let stageIndex=0;
let level=1;
let streak=0;
let points=0;
let timer=null;
let timeLimit=7;
let current=null;
let pool=[];
let lastChar=null;
let mistakePool=[];

// ===== GAME LOGIC =====

function updateStage(){
    document.getElementById("stage").innerText = stages[stageIndex].name;
    pool = stages[stageIndex].pool.slice(0, level);
}

function pick(){
    let available = [...pool];

    if(mistakePool.length > 0){
        available = available.concat(mistakePool);
    }

    let next;

    do {
        next = available[Math.floor(Math.random()*available.length)];
    } while (available.length > 1 && next.c === lastChar);

    current = next;
    lastChar = current.c;

    document.getElementById("char").innerText = current.c;
    document.getElementById("feedback").innerText = "";
    document.getElementById("answer").value = "";

    startTimer();
}

function startTimer(){
    let t = timeLimit;
    const bar = document.getElementById("bar");
    document.getElementById("time").innerText = t;
    bar.style.width = "100%";

    clearInterval(timer);

    timer = setInterval(()=>{
        t--;
        document.getElementById("time").innerText = t;
        bar.style.width = (t/timeLimit*100)+"%";

        if(t <= 0){
            clearInterval(timer);
            handleFail();
        }
    },1000);
}

function check(){
    clearInterval(timer);

    const val = document.getElementById("answer").value.trim().toLowerCase();

    if(current.a.includes(val)){
        streak++;
        mistakePool = mistakePool.filter(x => x.c !== current.c);
        let multiplier = 1 + Math.floor(streak/3);
        points += 10 * multiplier;
        document.getElementById("feedback").innerText = "Dobrze x"+multiplier;
        maybeLevelUp();
    } else {
        handleFail();
        return;
    }

    updateStats();
    pick();
}

function handleFail(){
    streak = 0;
    mistakePool.push(current);
    document.getElementById("feedback").innerText = "Źle: " + current.a[0];
    updateStats();
    pick();
}

function maybeLevelUp(){
    if(streak > 0 && streak % 5 === 0){
        level++;
        if(level > stages[stageIndex].pool.length){
            stageIndex++;
            level = 1;
            if(stageIndex >= stages.length){
                stageIndex = 0;
            }
        }
        document.getElementById("level").innerText = level;
        updateStage();
    }
}

function updateStats(){
    document.getElementById("points").innerText = points;
    document.getElementById("streak").innerText = streak;
}

function replay(){
    if('speechSynthesis' in window && current){
        const u = new SpeechSynthesisUtterance(current.c);
        u.lang = "ko-KR";
        speechSynthesis.speak(u);
    }
}

document.getElementById("answer").addEventListener("keydown", function(e){
    if(e.key === "Enter"){
        check();
    }
});

if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js');
}

updateStage();
pick();

</script>
</body>
</html>
