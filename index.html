<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HANGUESS</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111">

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#111;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}
#app{
  width:100%;
  max-width:500px;
  padding:20px;
  text-align:center;
}
button{
  padding:10px 18px;
  margin:5px;
  border-radius:10px;
  border:none;
  font-weight:bold;
  cursor:pointer;
}
input{
  padding:12px;
  font-size:20px;
  text-align:center;
  border-radius:10px;
  border:none;
  width:100%;
}
.hangul{
  font-size:80px;
  margin:20px 0;
}
.error{
  color:#ff4444;
  font-size:90px;
}
.hint{
  color:#ff8888;
  margin-top:10px;
}
.stats{
  margin-top:10px;
  font-size:14px;
  opacity:0.8;
}
.progressBar{
  height:6px;
  background:#333;
  margin:10px 0;
  border-radius:4px;
  overflow:hidden;
}
.progressInner{
  height:100%;
  background:#00ff88;
  width:100%;
  transition:width 0.3s;
}
.hidden{
  display:none;
}
</style>
</head>
<body>
<div id="app">

<h1>HANGUESS</h1>

<div id="modeSelect">
  <button onclick="startGame('learning')">Learning Mode</button>
  <button onclick="startGame('challenge')">Challenge Mode</button>
</div>

<div id="game" class="hidden">

<div id="stageInfo"></div>
<div id="levelInfo"></div>

<div class="progressBar">
  <div id="timerBar" class="progressInner"></div>
</div>

<div id="char" class="hangul"></div>

<input id="answer" autocomplete="off" />
<div id="feedback" class="hint"></div>

<div class="stats" id="stats"></div>

<button onclick="quit()">Wyjdź</button>

</div>

</div>

<script>
const stages = {

letters: [
["ㄱ","g"],["ㄴ","n"],["ㄷ","d"],["ㄹ","r"],
["ㅁ","m"],["ㅂ","b"],["ㅅ","s"],["ㅇ","ng"],
["ㅈ","j"],["ㅊ","ch"],["ㅋ","k"],["ㅌ","t"],
["ㅍ","p"],["ㅎ","h"],
["ㅏ","a"],["ㅓ","eo"],["ㅗ","o"],["ㅜ","u"],
["ㅡ","eu"],["ㅣ","i"]
],

batchim: [
["각","gak"],["간","gan"],["갈","gal"],
["감","gam"],["갑","gap"],["강","gang"],
["값","gaps"],["읽","ilg"]
],

syllables: [
["가","ga"],["너","neo"],["도","do"],
["고","go"],["구","gu"],["귀","gwi"],
["한","han"],["달","dal"]
],

words: [
["집","jip"],["사람","saram"],
["학교","hakgyo"],["사랑","sarang"],
["한국","hanguk"]
]

};

let mode;
let stageKeys = ["letters","batchim","syllables","words"];
let currentStageIndex=0;
let level=1;
let pool=[];
let requiredCorrect=2;
let progress={};
let currentItem;
let lastChar="";
let timer;
let timeLimit=5000;
let startTime;

function startGame(selected){
mode=selected;
document.getElementById("modeSelect").classList.add("hidden");
document.getElementById("game").classList.remove("hidden");
loadState();
initStage();
}

function initStage(){
let stageName=stageKeys[currentStageIndex];
let data=stages[stageName];
pool=data.slice(0,Math.min(level*4,data.length));
progress={};
pool.forEach(x=>progress[x[0]]=0);
updateUI();
nextQuestion();
}

function nextQuestion(){
let choices=pool.filter(x=>x[0]!==lastChar);
currentItem=choices[Math.floor(Math.random()*choices.length)];
lastChar=currentItem[0];
document.getElementById("char").className="hangul";
document.getElementById("char").textContent=currentItem[0];
document.getElementById("feedback").textContent="";
document.getElementById("answer").value="";
document.getElementById("answer").focus();
startTimer();
}

function startTimer(){
clearInterval(timer);
timeLimit=5000 - (level*200);
if(timeLimit<2000) timeLimit=2000;
startTime=Date.now();
timer=setInterval(()=>{
let elapsed=Date.now()-startTime;
let percent=100-(elapsed/timeLimit*100);
if(percent<0) percent=0;
document.getElementById("timerBar").style.width=percent+"%";
if(elapsed>timeLimit){
clearInterval(timer);
handleWrong("Czas minął!");
}
},50);
}

function handleCorrect(){
clearInterval(timer);
progress[currentItem[0]]++;
playBeep(800);
if(progress[currentItem[0]]>=requiredCorrect){
checkAdvance();
}
saveState();
nextQuestion();
}

function handleWrong(msg){
clearInterval(timer);
playBeep(200);
progress[currentItem[0]]--;
requiredCorrect++;
document.getElementById("char").className="hangul error";
document.getElementById("feedback").textContent=
msg+" Poprawnie: "+currentItem[1];
if(progress[currentItem[0]]<0){
let allZero=Object.values(progress).every(v=>v<=0);
if(allZero && level>1){
level--;
}
}
saveState();
setTimeout(nextQuestion,1200);
}

function checkAdvance(){
let allDone=Object.values(progress).every(v=>v>=requiredCorrect);
if(allDone){
level++;
let stageName=stageKeys[currentStageIndex];
if(level*4>stages[stageName].length){
currentStageIndex++;
level=1;
}
if(currentStageIndex>=stageKeys.length){
alert("Gra ukończona!");
quit();
return;
}
initStage();
}
}

document.getElementById("answer").addEventListener("keydown",e=>{
if(e.key==="Enter"){
if(e.target.value.trim().toLowerCase()===currentItem[1]){
handleCorrect();
}else{
handleWrong("Błąd!");
}
}
});

function updateUI(){
let stageName=stageKeys[currentStageIndex];
document.getElementById("stageInfo").textContent="Etap: "+stageName;
document.getElementById("levelInfo").textContent=
"Poziom: "+level+" | Znaki: "+pool.length+" | Wymagane: "+requiredCorrect;
if(mode==="challenge"){
document.getElementById("stats").classList.add("hidden");
}else{
document.getElementById("stats").classList.remove("hidden");
document.getElementById("stats").textContent=
"Progres: "+JSON.stringify(progress);
}
}

function playBeep(freq){
let ctx=new(window.AudioContext||window.webkitAudioContext)();
let osc=ctx.createOscillator();
osc.frequency.value=freq;
osc.connect(ctx.destination);
osc.start();
osc.stop(ctx.currentTime+0.15);
}

function quit(){
location.reload();
}

function saveState(){
localStorage.setItem("hanguess",JSON.stringify({
mode,currentStageIndex,level,requiredCorrect
}));
}

function loadState(){
let s=localStorage.getItem("hanguess");
if(s){
let data=JSON.parse(s);
mode=data.mode;
currentStageIndex=data.currentStageIndex;
level=data.level;
requiredCorrect=data.requiredCorrect;
}
}

if('serviceWorker' in navigator){
navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
